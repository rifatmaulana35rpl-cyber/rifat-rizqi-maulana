<!DOCTYPE html>
<html>
    <head>
        <title>Praktek Form</title>
    </head>
    <body>
        <h2>Form Pendaftaran Siswa</h2>
        <form>
            <table>
                <tr>
                    <td><label>Nama Lengkap</label></td>
                    <td>:</td>
                    <td><input type="text" required placeholder="Masukkan Nama"><br></td>
                </tr>
                <tr>
                    <td><label>NIK</label></td>
                    <td>:</td>
                    <td><input type="text" required placeholder="Masukkan NIK"><br></td>
                </tr>
                <tr>
                    <td><label>Tanggal lahir</label></td>
                    <td>:</td>
                    <td><input type="date" required><br></td>
                </tr>
                <tr>
                    <td><label>Alamat</label></td>
                    <td>:</td>
                    <td><textarea width="100" required placeholder="Masukkan Alamat"></textarea></td>
                </tr>
                <tr>
                    <td><label>Email</label></td>
                    <td>:</td>
                    <td><input type="email" required placeholder="Masukkan Email"><br></td>
                </tr>
                <tr>
                    <td><label>Password</label></td>
                    <td>:</td>
                    <td><input type="password" required placeholder="Masukkan Password"><br></td>
                </tr>
                <tr>
                    <td><label>Jenis Kelamin</label></td>
                    <td>:</td>
                    <td><input type="radio" name ="Jenis Kelamin">L
                    <input type="radio" name ="Jenis Kelamin">P<br></td>
                </tr>
                <tr>
                    <td><label>Hobi</label></td>
                    <td>:</td>
                    <td><input type="checkbox" name="hobi">Makan
                    <input type="checkbox" name="hobi">Tidur
                    <input type="checkbox" name="hobi">Olahraga
                    <input type="checkbox" name="hobi">Main Musik
                    <input type="checkbox" name="hobi">Ngoding
                    <input type="checkbox" name="hobi">Berenang<br></td>
                </tr>
                <tr>
                    <td><label>Jurusan</label></td>
                    <td>:</select></td>
                    <td><select name="jurusan">
                        <option>RPL</option>
                        <option>TKJ</option>
                        <option>PG</option>
                    </select><br></td>
                </tr>
                <tr>
                    <td><label>upload foto</label></td>
                    <td>:</td>
                    <td><input type="file"><br></td>
                </tr>

            </table><br>

            <button type="submit">Kirim</button>

        </form>
    </body>
</html>
